# Nginx reference redirects for Velza Global Group.
# Use only if this site is migrated from Apache to Nginx.
# Canonical site: https://www.velzaglobal.com/

location = /about-us.html             { return 301 https://www.velzaglobal.com/aboutus; }
location = /coffee-collection.html    { return 301 https://www.velzaglobal.com/coffeecollection; }
location = /coming-soon.html          { return 301 https://www.velzaglobal.com/comingsoon; }
location = /contact-us.html           { return 301 https://www.velzaglobal.com/contactus; }
location = /lifestyle-essentials.html { return 301 https://www.velzaglobal.com/lifestyleessentials; }
location = /luxury-beverage.html      { return 301 https://www.velzaglobal.com/luxurybeverage; }
location = /news-1.html               { return 301 https://www.velzaglobal.com/news1; }
location = /news-2.html               { return 301 https://www.velzaglobal.com/news2; }
location = /privacy-policy.html       { return 301 https://www.velzaglobal.com/privacypolicy; }
location = /pure-italian-spirits.html { return 301 https://www.velzaglobal.com/pureitalianspirits; }
location = /rosso-caffe.html          { return 301 https://www.velzaglobal.com/rossocaffe; }
location = /terms-and-conditions.html { return 301 https://www.velzaglobal.com/termsandconditions; }
location = /page-new-news.html        { return 301 https://www.velzaglobal.com/news; }

error_page 400 /400.html;
error_page 401 /401.html;
error_page 403 /403.html;
error_page 404 /404.html;
error_page 500 /500.html;
error_page 502 /502.html;
error_page 503 /503.html;
error_page 504 /504.html;

location ~ ^/(400|401|403|404|500|502|503|504)\.html$ {
    internal;
    root /path/to/your/webroot;
}
