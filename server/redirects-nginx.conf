# Nginx reference redirects for Velza Global Group.
# Use only if this site is migrated from Apache to Nginx.
# Canonical site: https://www.velzaglobal.com/

location = /aboutus.html              { return 301 https://www.velzaglobal.com/about-us; }
location = /coffeecollection.html     { return 301 https://www.velzaglobal.com/coffee-collection; }
location = /comingsoon.html           { return 301 https://www.velzaglobal.com/coming-soon; }
location = /contactus.html            { return 301 https://www.velzaglobal.com/contact-us; }
location = /lifestyleessentials.html  { return 301 https://www.velzaglobal.com/lifestyle-essentials; }
location = /luxurybeverage.html       { return 301 https://www.velzaglobal.com/luxury-beverage; }
location ~* ^/news-?1(\.html?)?$  { return 301 https://www.velzaglobal.com/tonino-lamborghini-velza-global-partnership-philippines; }
location ~* ^/news-?2(\.html?)?$  { return 301 https://www.velzaglobal.com/velza-global-tonino-lamborghini-partnership-india; }
location = /privacypolicy.html        { return 301 https://www.velzaglobal.com/privacy-policy; }
location = /pureitalianspirits.html   { return 301 https://www.velzaglobal.com/pure-italian-spirits; }
location = /rossocaffe.html           { return 301 https://www.velzaglobal.com/rosso-caffe; }
location = /termsandconditions.html   { return 301 https://www.velzaglobal.com/terms-and-conditions; }
location = /page-new-news.html        { return 301 https://www.velzaglobal.com/news; }

error_page 400 /400.html;
error_page 401 /401.html;
error_page 403 /403.html;
error_page 404 /404.html;
error_page 500 /500.html;
error_page 502 /502.html;
error_page 503 /503.html;
error_page 504 /504.html;

location ~ ^/(400|401|403|404|500|502|503|504)\.html$ {
    internal;
    root /path/to/your/webroot;
}
