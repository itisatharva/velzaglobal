---
# ======================================================================
# cPanel Git Version Control - deployment manifest
# ======================================================================
#
# How this runs:
#   cPanel > Git Version Control > Manage > "Update from Remote" then
#   "Deploy HEAD Commit". cPanel reads this file from the checked-out
#   branch and runs the tasks below as your cPanel user.
#
# TARGET: derived from the checked-out branch, not hard-coded.
#   main           -> /home/velzhsrg/public_html   (production)
#   anything else  -> /home/velzhsrg/staging
#
# It reads the branch rather than a literal path on purpose. A literal
# path lives in the file, so it travels with every branch cut from the
# one that carries it: set it to public_html on main and the next
# feature branch inherits public_html, and deploying that branch to the
# staging repo writes to the live site. Branch-derived, a feature branch
# can only ever resolve to staging.
#
# The fallback direction is deliberate: an unreadable branch, a detached
# HEAD, or anything unexpected resolves to STAGING, never production.
#
# Deliberately NOT using rsync --delete. A wrong DEPLOYPATH with
# --delete would erase the live site. Stale files are the cheaper
# failure. Revisit only after a clean production deploy.
#
# Never touches /home/velzhsrg/private_config/ (DB + SMTP secrets,
# read by events/*.php and shared/vendor/simple-forms) or events/*.log.
# ----------------------------------------------------------------------

deployment:
  tasks:
    - export REPOPATH=$(pwd)
    - export DEPLOYBRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)
    - 'export DEPLOYPATH=$([ "$DEPLOYBRANCH" = "main" ] && echo /home/velzhsrg/public_html || echo /home/velzhsrg/staging)'

    # Surfaces in the cPanel deploy log, so a deploy that lands in the
    # wrong place is visible without guessing.
    - 'echo "Deploying branch $DEPLOYBRANCH -> $DEPLOYPATH"'

    - /bin/mkdir -p "$DEPLOYPATH"

    # Ship the site. Excludes are the repo-only files DEPLOY.md says
    # must not reach the webroot.
    - >-
      /usr/bin/rsync -a
      --exclude '.git/'
      --exclude '.gitignore'
      --exclude '.cpanel.yml'
      --exclude 'deployment/'
      --exclude 'server/'
      --exclude '*.md'
      --exclude '.DS_Store'
      --exclude 'skills-lock.json'
      --exclude 'events/*.log'
      --exclude 'events/*.lock'
      "$REPOPATH"/ "$DEPLOYPATH"/

    # .htaccess at 600 causes a 500 error (DEPLOY.md STEP 3).
    - /bin/find "$DEPLOYPATH" -type d -exec /bin/chmod 755 {} +
    - /bin/find "$DEPLOYPATH" -type f -exec /bin/chmod 644 {} +

    # Region routing depends on both .htaccess layers being readable.
    - /bin/chmod 644 "$DEPLOYPATH"/.htaccess
    - /bin/chmod 644 "$DEPLOYPATH"/regions/hk/.htaccess
    - /bin/chmod 644 "$DEPLOYPATH"/regions/in/.htaccess
    - /bin/chmod 644 "$DEPLOYPATH"/regions/ph/.htaccess
    - /bin/chmod 644 "$DEPLOYPATH"/events/.htaccess
