---
# ======================================================================
# cPanel Git Version Control - deployment manifest
# ======================================================================
#
# How this runs:
#   cPanel > Git Version Control > Manage > "Update from Remote" then
#   "Deploy HEAD Commit". cPanel reads this file from the checked-out
#   branch and runs the tasks below as your cPanel user.
#
# TARGET: PRODUCTION. Every deploy publishes to velzaglobal.com.
#   /home/velzhsrg/public_html
#
# This is unconditional by request: hitting "Deploy HEAD Commit" always
# goes live, whatever branch is checked out. Two consequences to hold
# in mind:
#
#   1. Deploy from main. Whatever branch cPanel has checked out is what
#      the public sees - a half-finished branch included.
#   2. This file no longer routes anything to /home/velzhsrg/staging.
#      A staging cPanel repo running this same file would publish to
#      production. Point staging at its own branch whose .cpanel.yml
#      keeps DEPLOYPATH=/home/velzhsrg/staging, or stop deploying it.
#
# The deploy log's first line prints the resolved path. Read it.
#
# Deliberately NOT using rsync --delete. A wrong DEPLOYPATH with
# --delete would erase the live site. Stale files are the cheaper
# failure. Revisit only after a clean production deploy.
#
# Never touches /home/velzhsrg/private_config/ (DB + SMTP secrets,
# read by events/*.php and shared/vendor/simple-forms) or events/*.log.
# ----------------------------------------------------------------------

deployment:
  tasks:
    - export REPOPATH=$(pwd)
    - export DEPLOYPATH=/home/velzhsrg/public_html
    - export DEPLOYBRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)

    # Surfaces in the cPanel deploy log: which branch just went live.
    - 'echo "PUBLISHING branch $DEPLOYBRANCH LIVE -> $DEPLOYPATH"'

    - /bin/mkdir -p "$DEPLOYPATH"

    # Ship the site. Excludes are the repo-only files DEPLOY.md says
    # must not reach the webroot.
    - >-
      /usr/bin/rsync -a
      --exclude '.git/'
      --exclude '.gitignore'
      --exclude '.cpanel.yml'
      --exclude 'deployment/'
      --exclude 'server/'
      --exclude '*.md'
      --exclude '.DS_Store'
      --exclude 'skills-lock.json'
      --exclude 'events/*.log'
      --exclude 'events/*.lock'
      "$REPOPATH"/ "$DEPLOYPATH"/

    # .htaccess at 600 causes a 500 error (DEPLOY.md STEP 3).
    - /bin/find "$DEPLOYPATH" -type d -exec /bin/chmod 755 {} +
    - /bin/find "$DEPLOYPATH" -type f -exec /bin/chmod 644 {} +

    # Region routing depends on both .htaccess layers being readable.
    - /bin/chmod 644 "$DEPLOYPATH"/.htaccess
    - /bin/chmod 644 "$DEPLOYPATH"/regions/hk/.htaccess
    - /bin/chmod 644 "$DEPLOYPATH"/regions/in/.htaccess
    - /bin/chmod 644 "$DEPLOYPATH"/regions/ph/.htaccess
    - /bin/chmod 644 "$DEPLOYPATH"/events/.htaccess
