name: Deploy to Namecheap

# ======================================================================
# GitHub -> Namecheap (cPanel/Apache) deployment
#
#   push to main      -> deploys to production  (www.velzaglobal.com)
#   push to staging   -> deploys to staging     (staging.velzaglobal.com)
#   manual dispatch   -> either, chosen at run time
#
# Transport is FTPS. See README.md "Deployment" for why FTPS rather than
# cPanel Git Version Control or rsync, and for the required secrets.
# ======================================================================

on:
  push:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      target:
        description: "Which environment to deploy"
        required: true
        default: staging
        type: choice
        options: [staging, production]

concurrency:
  # Never let two deploys write to the same web root at once - a half
  # finished upload interleaved with another is how you get a broken
  # live site. Queue instead of cancelling so no push is silently lost.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ====================================================================
  # Gate: cheap correctness checks that must pass before anything ships.
  # ====================================================================
  checks:
    name: Pre-deploy checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regions expose the same set of pages
        # The three regions are duplicated copies, not templates. A page
        # added to one and forgotten in the others 404s for that region's
        # visitors only - which is exactly the kind of bug nobody notices
        # from an office in a different country.
        run: |
          set -euo pipefail
          for r in hk ph in; do
            ls regions/$r | grep '\.html$' | sort > "/tmp/pages-$r.txt"
          done
          status=0
          for r in ph in; do
            if ! diff -q /tmp/pages-hk.txt "/tmp/pages-$r.txt" >/dev/null; then
              echo "::error::regions/$r has a different page set than regions/hk"
              diff /tmp/pages-hk.txt "/tmp/pages-$r.txt" || true
              status=1
            fi
          done
          exit $status

      - name: No server logs or secrets committed
        run: |
          set -euo pipefail
          if git ls-files | grep -qiE '(^|/)(error_log|access_log)$|\.log$|\.lock$|\.htpasswd$|\.pem$|\.key$'; then
            echo "::error::A log/secret file is tracked in git. These belong in .gitignore."
            git ls-files | grep -iE '(^|/)(error_log|access_log)$|\.log$|\.lock$|\.htpasswd$|\.pem$|\.key$'
            exit 1
          fi
          echo "OK - no log or secret files tracked"

      - name: Internal /regions/ paths are never linked publicly
        # Pages must link to canonical URLs like /aboutus. A literal
        # /regions/xx/ href would leak the internal layout and pin the
        # visitor to one region, defeating the routing entirely.
        run: |
          set -euo pipefail
          if grep -rn 'href="/regions/' regions/ 2>/dev/null; then
            echo "::error::A page links directly into /regions/. Use the canonical path instead."
            exit 1
          fi
          echo "OK - no direct /regions/ links"

      - name: Shared assets exist at the web root
        # Page HTML references assets relatively; under geo-routing those
        # resolve to /assets/... at the root. If this directory ever moves
        # back inside a region folder, every stylesheet and image 404s.
        run: |
          set -euo pipefail
          test -d assets/css && test -d assets/js || { echo "::error::/assets is missing from the web root"; exit 1; }
          if ls -d regions/*/assets 2>/dev/null | grep -q .; then
            echo "::error::A region contains its own assets/ directory. Assets must be shared at the web root."
            exit 1
          fi
          echo "OK - single shared /assets at web root"

  # ====================================================================
  # Deploy
  # ====================================================================
  deploy:
    name: Deploy
    needs: checks
    runs-on: ubuntu-latest

    # Resolve environment from the branch, or from the manual input.
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.target) || (github.ref == 'refs/heads/main' && 'production') || 'staging' }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "env=${{ inputs.target }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "env=production" >> "$GITHUB_OUTPUT"
          else
            echo "env=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21

          # Web root for this environment, e.g. public_html/ for production
          # or staging.velzaglobal.com/ for the staging subdomain. Set per
          # environment in GitHub so the branch cannot target the wrong one.
          server-dir: ${{ secrets.FTP_SERVER_DIR }}

          local-dir: ./

          # Incremental: the action keeps a manifest on the server and
          # transfers only what changed. The first run uploads everything
          # (~63 MB) and is slow; later runs are seconds.
          state-name: .ftp-deploy-sync-state.json

          # NEVER enable this. It wipes the remote directory before
          # uploading, which would destroy the server-only files listed
          # in exclude below - including live RSVP logs.
          dangerous-clean-slate: false

          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/.DS_Store
            deployment/**
            README.md
            CLAUDE.md
            REGIONAL-ROUTING.md
            .gitignore
            **/error_log
            **/access_log
            **/*.log
            **/*.lock
            .well-known/**
            .ftp-deploy-sync-state.json

      - name: Summary
        run: |
          {
            echo "### Deployed to ${{ steps.target.outputs.env }}"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- branch: \`${{ github.ref_name }}\`"
            if [ "${{ steps.target.outputs.env }}" = "production" ]; then
              echo "- url: https://www.velzaglobal.com/"
            else
              echo "- url: https://staging.velzaglobal.com/"
            fi
            echo ""
            echo "Verify regional routing:"
            echo '```'
            echo 'curl -sI -H "CF-IPCountry: IN" https://www.velzaglobal.com/ | head -1'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
